# =============================================================================
# pytest.ini - Configuration for pytest (our test runner).
#
# HOW TO RUN TESTS:
#   pytest                           → run ALL tests
#   pytest apps/accounts/            → run only accounts app tests
#   pytest apps/accounts/tests/test_models.py  → run one specific test file
#   pytest -v                        → verbose mode (shows each test name)
#   pytest --cov=apps                → show code coverage report
#
# WHY PYTEST OVER DJANGO'S DEFAULT?
#   - Simpler syntax (no self.assertEqual, just use Python's "assert")
#   - Better error messages when tests fail
#   - Supports fixtures (reusable test setup)
#   - Rich plugin ecosystem
# =============================================================================

[pytest]
# Tell pytest which Django settings to use
DJANGO_SETTINGS_MODULE = lms.settings

# Which file patterns to look for as test files
python_files = tests.py test_*.py

# Which class patterns to look for as test classes
python_classes = *Test

# Which function patterns to look for as test functions
python_functions = test_*
