{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm your password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: "Poppins", sans-serif;
        position: relative;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image:
          linear-gradient(
            160deg,
            rgba(11, 80, 227, 0.25),
            rgba(220, 223, 228, 0.1)
          ),
          url("{% static 'accounts/registration_image.jpg' %}");
        background-size: cover;
        background-position: center;
        filter: blur(5px);
        transform: scale(1.1);
      }
      .card {
        width: 100%;
        max-width: 480px;
        padding: 48px 56px;
        border-radius: 28px;
        background: #dcdfe4;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
      }
      .logo {
        display: inline-block;
        margin-bottom: 52px;
        padding: 8px 20px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
      }
      h1 {
        margin-bottom: 8px;
        color: #0b50e3;
        font-size: 26px;
        font-weight: 600;
        text-align: center;
      }
      .intro {
        margin-bottom: 30px;
        color: #2b2210;
        font-size: 13px;
        text-align: center;
        line-height: 1.6;
      }
      label {
        display: block;
        margin: 0 0 6px 4px;
        color: #555b68;
        font-size: 12px;
      }
      .input-wrap {
        position: relative;
      }
      input {
        width: 100%;
        padding: 14px 48px 14px 18px;
        border: none;
        border-radius: 999px;
        outline: none;
        background: rgba(255, 255, 255, 0.55);
        color: #1f2430;
        font: inherit;
        font-size: 14px;
      }
      input:focus {
        background: #fff;
        box-shadow: 0 0 0 3px rgba(240, 190, 90, 0.35);
      }
      .toggle-pw {
        position: absolute;
        top: 50%;
        right: 18px;
        transform: translateY(-50%);
        cursor: pointer;
        opacity: 0.6;
      }
      .error {
        display: none;
        margin-bottom: 14px;
        padding: 10px 14px;
        border: 1px solid rgba(220, 38, 38, 0.25);
        border-radius: 12px;
        background: rgba(220, 38, 38, 0.1);
        color: #b91c1c;
        font-size: 12px;
        text-align: center;
      }
      .error.visible {
        display: block;
      }
      button {
        width: 100%;
        margin-top: 22px;
        padding: 15px;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, #0b50e3, #dcdfe4);
        color: #2b2210;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }
      .back {
        display: block;
        margin-top: 22px;
        color: #1f2430;
        font-size: 12px;
        text-align: center;
        text-decoration: underline;
      }
      .modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: rgba(15, 23, 42, 0.55);
      }
      .modal-overlay.show {
        display: flex;
      }
      .modal {
        width: 100%;
        max-width: 400px;
        padding: 28px;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
        text-align: center;
      }
      .modal-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        margin: 0 auto 14px;
        border-radius: 50%;
        background: rgba(11, 80, 227, 0.12);
        color: #0b50e3;
        font-size: 22px;
        font-weight: 700;
      }
      .modal h2 {
        margin-bottom: 8px;
        color: #111;
        font-size: 18px;
        font-weight: 600;
      }
      .modal p {
        margin-bottom: 20px;
        color: #4a4a4a;
        font-size: 13px;
        line-height: 1.6;
      }
      .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      .modal-actions button {
        width: auto;
        margin-top: 0;
        padding: 10px 22px;
        font-size: 13px;
      }
      .modal-actions .secondary {
        background: #eef0f3;
        color: #333;
      }
      .modal-actions .primary {
        background: linear-gradient(135deg, #0b50e3, #4f83f0);
        color: #fff;
      }
      @media (max-width: 520px) {
        .card {
          padding: 36px 28px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">EDVANCE</div>
      <h1>Confirm your password</h1>
      <p class="intro">Re-enter your password to complete your registration.</p>
      <div class="error" id="error-msg" role="alert"></div>
      <form id="password-confirmation-form">
        {% csrf_token %}
        <label for="password2">Re-enter password</label>
        <div class="input-wrap">
          <input
            type="password"
            id="password2"
            autocomplete="new-password"
            required
          />
          <span class="toggle-pw" onclick="togglePw('password2')">👁</span>
        </div>
        <button type="submit" id="submit-btn">Create account</button>
      </form>
      <a class="back" href="{% url 'accounts:register' %}"
        >Back to registration</a
      >
    </main>

    <div
      class="modal-overlay"
      id="existing-user-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="existing-user-title"
    >
      <div class="modal">
        <div class="modal-icon">!</div>
        <h2 id="existing-user-title">Account already exists</h2>
        <p>
          This username is already registered. Would you like to log in instead?
        </p>
        <div class="modal-actions">
          <button type="button" class="secondary" id="existing-user-close">
            Not now
          </button>
          <a href="{% url 'accounts:login' %}">
            <button type="button" class="primary">Log in</button>
          </a>
        </div>
      </div>
    </div>

    <script>
      const API_URL = "{% url 'accounts:register_api' %}";
      const DASHBOARD_URL = "{% url 'accounts:dashboard_redirect' %}";
      const REGISTER_URL = "{% url 'accounts:register' %}";
      const existingUserModal = document.getElementById("existing-user-modal");
      const existingUserClose = document.getElementById("existing-user-close");
      const DRAFT_KEY = "register_form_draft";
      const form = document.getElementById("password-confirmation-form");
      const passwordInput = document.getElementById("password2");
      const errorEl = document.getElementById("error-msg");
      const submitBtn = document.getElementById("submit-btn");

      function togglePw(id) {
        const input = document.getElementById(id);
        input.type = input.type === "password" ? "text" : "password";
      }

      function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.add("visible");
      }

      function getCsrfToken() {
        const input = document.querySelector("[name=csrfmiddlewaretoken]");
        return input ? input.value : "";
      }

      function closeExistingUserModal() {
        existingUserModal.classList.remove("show");
      }

      existingUserClose.addEventListener("click", closeExistingUserModal);
      existingUserModal.addEventListener("click", (event) => {
        if (event.target === existingUserModal) closeExistingUserModal();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeExistingUserModal();
      });

      let draft;
      try {
        draft = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || "null");
      } catch (error) {
        draft = null;
      }

      if (!draft || !draft.password) {
        window.location.replace(REGISTER_URL);
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorEl.classList.remove("visible");

        if (passwordInput.value !== draft.password) {
          showError("The passwords do not match. Please try again.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Creating account...";

        const payload = {
          username: draft.username,
          first_name: draft.first_name,
          last_name: draft.last_name,
          email: draft.email,
          role: draft.role,
          password: draft.password,
          password2: passwordInput.value,
          terms_accepted: true,
        };

        try {
          const response = await fetch(API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": getCsrfToken(),
            },
            body: JSON.stringify(payload),
          });
          const data = await response.json();

          if (!response.ok) {
            const messages = Object.values(data).flat().join(" ");
            const accountExists = /already exists|unique/i.test(messages);
            if (accountExists) {
              existingUserModal.classList.add("show");
            } else {
              showError(messages || "Registration failed.");
            }
            submitBtn.disabled = false;
            submitBtn.textContent = "Create account";
            return;
          }

          sessionStorage.removeItem(DRAFT_KEY);
          localStorage.setItem("access_token", data.access);
          localStorage.setItem("refresh_token", data.refresh);
          window.location.href = DASHBOARD_URL;
        } catch (error) {
          showError("Network error. Please try again.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Create account";
        }
      });
    </script>
  </body>
</html>
