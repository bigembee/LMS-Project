{% extends 'base.html' %}
{% block title %}Delete Semester{% endblock %}
{% block content %}
<h1>Delete Semester</h1>
<p>Are you sure you want to delete <strong>{{ semester.get_name_display }}</strong> from {{ semester.session.name }}? This cannot be undone.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>

<p><a href="{% url 'administration:manage_sessions' %}">&larr; Cancel</a></p>
{% endblock %}
