{% extends 'base.html' %}
{% block title %}Edit Session{% endblock %}
{% block content %}
<h1>Edit Session: {{ session.name }}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Changes</button>
</form>

<p><a href="{% url 'administration:manage_sessions' %}">&larr; Back to Sessions</a></p>
{% endblock %}
