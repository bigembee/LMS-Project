{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Course{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'administration/admin.css' %}">
{% endblock %}

{% block content %}
<div class="admin-dashboard">
    <h1>Edit Course: {{ course.code }}</h1>

    <form method="post" class="admin-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="admin-btn">Save Changes</button>
    </form>

    <p class="back-link"><a class="admin-link" href="{% url 'administration:manage_courses' %}">&larr; Back to Courses</a></p>
</div>
{% endblock %}
