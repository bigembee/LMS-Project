{% extends 'base.html' %}
{% block title %}Edit Course{% endblock %}
{% block content %}
<h1>Edit Course: {{ course.code }}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Changes</button>
</form>

<p><a href="{% url 'administration:manage_courses' %}">&larr; Back to Courses</a></p>
{% endblock %}
