{% extends 'base.html' %}
{% load static %}

{% block title %}Delete Department{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'administration/admin.css' %}">
{% endblock %}

{% block content %}
<div class="admin-dashboard">
    <h1>Delete Department</h1>
    <p>Are you sure you want to delete <strong>{{ department.name }}</strong>? This cannot be undone.</p>

    <form method="post" class="admin-form">
        {% csrf_token %}
        <button type="submit" class="admin-btn admin-btn--danger">Yes, Delete</button>
    </form>

    <p class="back-link"><a class="admin-link" href="{% url 'administration:manage_departments' %}">&larr; Cancel</a></p>
</div>
{% endblock %}
