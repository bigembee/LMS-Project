{% extends 'base.html' %}
{% block title %}Delete Session{% endblock %}
{% block content %}
<h1>Delete Session</h1>
<p>Are you sure you want to delete <strong>{{ session.name }}</strong>? This will also delete its semesters. This cannot be undone.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, Delete</button>
</form>

<p><a href="{% url 'administration:manage_sessions' %}">&larr; Cancel</a></p>
{% endblock %}
